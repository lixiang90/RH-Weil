name: finite-sanity-checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Validate paper layout
        run: python scripts/check_repo_layout.py
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Report numerical runtime
        run: python -c "import sys, numpy, mpmath; print(sys.version); print('numpy', numpy.__version__, 'mpmath', mpmath.__version__)"
      - name: Run registered finite checks
        run: python -u scripts/run_checks.py
